# Diagnostic-only branch version: six public reads, no checkout, secrets, or publishing.
name: Diagnose archive public reads

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - name: Read public archive objects
        run: |
          cat > "$RUNNER_TEMP/diagnose.ts" <<'EOF'
          const DATA_URL = "https://data.f1.wrick17.com/";
          const RUN_371 = "objects/32dc0a9eb6b0ffc1b13a4bd4e91612a83e89f39ba63591b9d0dee98313994f06.json";
          const RUN_372 = "objects/206224366c3ebf43040329469881fd8834e6edc17aa498698ed3de1a19692048.json";
          const HEADERS = [
            "cf-ray",
            "cf-mitigated",
            "cf-cache-status",
            "server",
            "content-type",
            "date",
            "cache-control",
            "access-control-allow-origin",
          ];
          const json = { accept: "application/json" };
          const t = Date.now();
          const requests: [string, string, Record<string, string>?][] = [
            ["1 catalog published json-accept", `catalog.json?published=${t}`, json],
            ["2 run371 verify default", `${RUN_371}?verify=${t}`],
            ["3 run372 verify default", `${RUN_372}?verify=${t}`],
            ["4 run371 verify json-accept", `${RUN_371}?verify=${t}`, json],
            ["5 run372 verify json-accept", `${RUN_372}?verify=${t}`, json],
            ["6 run372 bare default", RUN_372],
          ];

          // Reads at most 4096 bytes and returns only a recognised Cloudflare error number.
          const cloudflareCode = async (body: ReadableStream<Uint8Array> | null) => {
            if (!body) return "";
            const reader = body.getReader();
            const chunks: Uint8Array[] = [];
            let size = 0;
            try {
              while (size < 4096) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                size += value.length;
              }
            } finally {
              await reader.cancel().catch(() => {});
            }
            const text = new TextDecoder().decode(Buffer.concat(chunks).subarray(0, 4096));
            return text.match(/error code:?\s*(\d{4,5})\b/i)?.[1] ?? "";
          };

          console.log(`bun ${Bun.version} revision ${Bun.revision}`);
          const failed: string[] = [];
          for (const [label, path, headers] of requests) {
            const url = `${DATA_URL}${path}`;
            const fields = [`utc=${new Date().toISOString()}`, `label="${label}"`, "method=GET", `url=${url}`];
            try {
              const response = await fetch(url, {
                cache: "no-store",
                redirect: "manual",
                signal: AbortSignal.timeout(30_000),
                ...(headers && { headers }),
              });
              fields.push(`status=${response.status}`);
              for (const name of HEADERS) fields.push(`${name}=${response.headers.get(name) ?? "-"}`);
              if (response.ok) {
                await response.body?.cancel().catch(() => {});
              } else {
                failed.push(label);
                const code = await cloudflareCode(response.body).catch(() => "");
                fields.push(`cloudflare-error=${code || "-"}`);
              }
            } catch (error) {
              failed.push(label);
              const timeout = error instanceof Error && error.name === "TimeoutError";
              fields.push(`status=request-failed timeout=${timeout}`);
            }
            console.log(fields.join(" "));
          }
          console.log(`summary ok=${requests.length - failed.length} failed=${failed.length}`);
          for (const label of failed) console.log(`::error::Diagnostic read failed: ${label}`);
          if (failed.length) process.exit(1);
          EOF
          bun "$RUNNER_TEMP/diagnose.ts"
